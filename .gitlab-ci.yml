# ============================================================
# GitLab CI —— Geo 平台
#
# 现实约束:目前只有 1 个 runner、并发 = 1(所有 job 串行排队),
# 所以墙钟 ≈ 各 job 时长之和。优化思路是「减少总工作量」,而不是堆并行:
#   - 后端测试不再拆 4 片(单 runner 上拆片只会重复装依赖 + 互相排队,纯浪费)
#   - 缓存 venv / pnpm store(按 lock 文件哈希做 key),装依赖从 ~45s 降到 ~5s
#   - 纯文档改动不触发流水线(workflow:rules:changes)
#   - 新 push 自动取消旧流水线(interruptible)、基础设施类瞬时失败自动重试(retry)
#   - 测试用 MySQL 关掉全部耐久性保证(一次性容器,不需要抗崩溃,换写入速度)
#   - security-audit 不再每条流水线都跑:只在 requirements* 变更时 + 夜间
#     schedule 跑(它 allow_failure 本来就不拦合并,每次都跑纯属白占 runner)
#   - 分级门禁:develop 等日常开发分支 push 只跑轻流水线(lint + 前端检查);
#     全量 backend-test 只在 MR 流水线 + main 上跑——守住「进 main」这一道闸,
#     坏改动最迟在开 MR 时被拦下,不会带病合入
#     发版级流水线(tag 驱动构建+部署,参照 HrSystem 的 kaniko+Harbor 模式)后续另建
#   - 后端测试 job 内用 pytest-xdist 并行(-n $GEO_CI_PYTEST_WORKERS + 按 worker 拆库,
#     见 server/tests/utils.py):不占额外 runner 槽位;-n 2 实测 410.86s(效率 1.83x)。
#     -n 4 虽再快 ~70s 但有间歇竞态(test_phase4 manual-confirm 的后台线程被 CPU 争抢
#     放大,2 次全量 1 次挂)——已回退 -n 2,竞态测试加固后再升
#
# 若将来把 runner 的 concurrent 调到 ≥4(或加 runner),可参照
# .github/workflows/ci.yml 把 backend-test 重新拆成 parallel:matrix 并行,
# 后端测试能从 ~8min 压到 ~2min。改 runner 才是追平 GitHub 速度的关键。
# ============================================================

# 触发流水线的「代码相关」路径(纯文档改动则不跑,省下唯一的 runner)
.code-paths: &code-paths
  - server/**/*
  - web/**/*
  - requirements*.txt
  - pyproject.toml
  - alembic.ini
  - .gitlab-ci.yml
  - Dockerfile*
  - docker-compose*.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'              # 夜间定时:只有 security-audit 会跑(其余 job 的 rules 主动让位)
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'   # 有开着的 MR 时不重复跑分支流水线
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_COMMIT_BRANCH'
      changes: *code-paths

stages:
  - lint
  - test
  - frontend

variables:
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"
  FF_USE_FASTZIP: "true"          # 更快的缓存压缩
  GEO_JWT_SECRET: "ci-test-secret-not-for-prod"
  GEO_DATA_DIR: "$CI_PROJECT_DIR/geo-test-data"
  GEO_CI_PYTEST_WORKERS: "2"      # pytest-xdist 并行度;-n 4 有间歇竞态(见文件头注释),修好前保持 2

default:
  interruptible: true             # 新 push 进来自动取消旧的在跑流水线,腾出 runner
  retry:
    max: 2
    when:                         # 只对基础设施类瞬时失败重试(镜像拉取/网络/超时),不重试真实脚本失败
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure

# 常规 job 共用的 rules:夜间 schedule 流水线是 security-audit 专场,其余 job 让位
.skip-on-schedule: &skip-on-schedule
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
    when: never
  - when: on_success

# ---- 复用:Python 环境 + venv 缓存(按 requirements 哈希做 key,装依赖近乎秒级)----
.python:
  image: public.ecr.aws/docker/library/python:3.12-slim
  tags: [docker]
  cache:
    - key:
        prefix: venv
        files:
          - requirements.txt
          - requirements-dev.txt
      paths:
        - .venv/
        - .pip-cache/
  before_script:
    - test -d .venv || python -m venv .venv
    - . .venv/bin/activate
    - pip install --quiet -r requirements.txt -r requirements-dev.txt

# ============================================================
# 后端 Lint(放在最前:失败则后面的测试/前端整段跳过,快速反馈 + 省 runner)
# ============================================================
backend-lint:
  extends: .python
  stage: lint
  rules: *skip-on-schedule
  script:
    - ruff check server/
    - ruff format --check server/
    - mypy server/app

# ============================================================
# 后端测试(全套一次跑完,不分片)
# ============================================================
backend-test:
  extends: .python
  stage: test
  # 分级门禁:全量测试只守「进 main」这道闸。develop 等日常分支的 push 走轻流水线
  # (只有 backend-lint + frontend),这里显式不跑;开 MR 后的每次 push 都会全量跑。
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: public.ecr.aws/docker/library/mysql:8.0
      alias: mysql
      # 一次性测试库:关掉 binlog / 逐事务刷盘 / 双写缓冲等全部耐久性保证,
      # 换事务写入速度(测试套件重 DB、海量小事务提交,这里是主要磁盘开销)
      command:
        - --skip-log-bin
        - --sync-binlog=0
        - --innodb-flush-log-at-trx-commit=0
        - --innodb-doublewrite=OFF
      variables:
        MYSQL_ROOT_PASSWORD: testpw
        MYSQL_DATABASE: geo_test
  variables:
    FF_NETWORK_PER_BUILD: "1"
    GEO_TEST_DATABASE_URL: "mysql+pymysql://root:testpw@mysql:3306/geo_test"
  script:
    - |
      echo "等待 MySQL 就绪 ..."
      for i in $(seq 1 60); do
        if python -c "import pymysql; pymysql.connect(host='mysql', user='root', password='testpw', database='geo_test').close()" 2>/dev/null; then
          echo "MySQL ready"; break
        fi
        if [ "$i" -eq 60 ]; then echo "MySQL 等待超时"; exit 1; fi
        sleep 2
      done
    # -n:xdist 并行,每 worker 独立库(utils.py 自动建 geo_test_gw0/gw1...);
    # --dist loadfile:同文件用例落同一 worker,保留文件内的执行顺序
    - pytest server/tests/ -q --timeout=120 -n "$GEO_CI_PYTEST_WORKERS" --dist loadfile

# ============================================================
# 依赖安全扫描(后端 pip-audit)—— 非阻塞,仅告警
# 修复:pip-audit 没有 -i 参数(那会把 URL 当成位置参数 project_path 报错);
#       镜像源改走 PIP_INDEX_URL 环境变量。与 GitHub CI 用同一个 requirements-audit.txt。
# 触发时机:只在依赖清单变化的流水线上跑 + 夜间 schedule 例行全量扫描
# (schedule 在 GitLab UI / API 建,指向 main;本文件合并进 main 后再启用)
# ============================================================
security-audit:
  image: public.ecr.aws/docker/library/python:3.12-slim
  tags: [docker]
  stage: test
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - requirements*.txt
  cache:
    - key: pipaudit
      paths:
        - .pip-cache/
  script:
    - pip install --quiet pip-audit
    - pip-audit -r requirements-audit.txt

# ============================================================
# 前端:类型检查 + 构建(末尾附带非阻塞 pnpm audit)
# ============================================================
frontend:
  image: public.ecr.aws/docker/library/node:22-bookworm-slim
  tags: [docker]
  stage: frontend
  rules: *skip-on-schedule
  cache:
    - key:
        prefix: pnpm
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.4.0 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile --registry https://registry.npmmirror.com
  script:
    - pnpm --filter @geo/web typecheck
    - pnpm --filter @geo/web build
    - pnpm audit --audit-level moderate || true   # 非阻塞,仅告警
